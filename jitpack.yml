# JitPack build configuration for the Stockfish Android library.
#
# Builds libstockfish.so from the C++ sources at the repo root plus the Kotlin
# API in stockfish/, then publishes the release AAR. Toolchain versions are
# pinned so the native binary is reproducible (must match the consuming app).

jdk:
  - openjdk17

before_install:
  # Accept licenses, then install the pinned NDK + CMake and the target platform.
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platforms;android-37" "ndk;29.0.14206865" "cmake;4.1.2"

install:
  - ./gradlew :stockfish:publishReleasePublicationToMavenLocal --no-daemon --stacktrace
